<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>11th room Login</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  font-family:
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    sans-serif;

  background:
    linear-gradient(rgba(28,32,26,.9),rgba(28,32,26,.9)),
    repeating-linear-gradient(
      90deg,
      #332c20 0,
      #403726 4px,
      #2b241b 8px,
      #3c3325 15px
    );
}

.login-box{
  width:min(460px,100%);
  padding:38px 30px;
  text-align:center;

  background:
    linear-gradient(#faf6eb,#eee5ce);

  border:1px solid #b99a5c;

  box-shadow:
    0 20px 50px rgba(0,0,0,.4);
}

.logo{
  color:#7b6031;
  letter-spacing:5px;
  font-size:13px;
}

h1{
  margin:12px 0;
  font-family:Georgia,"Times New Roman",serif;
  color:#3f3321;
  font-size:38px;
}

.line{
  width:90px;
  height:1px;
  background:#b99a5c;
  margin:20px auto 28px;
}

label{
  display:block;
  text-align:left;
  color:#554a37;
  font-size:14px;
  margin-bottom:8px;
}

input{
  width:100%;
  padding:15px;
  border:1px solid #b7a98d;
  background:#fffdf7;
  font-size:18px;
  outline:none;
}

input:focus{
  border-color:#806332;
}

button{
  width:100%;
  margin-top:18px;
  padding:15px;

  color:#fff;
  background:#26392c;
  border:1px solid #b99a5c;

  font-size:16px;
  cursor:pointer;
}

button:hover{
  background:#3a5140;
}

.hint{
  margin-top:18px;
  font-size:13px;
  color:#77705f;
}

.error{
  min-height:22px;
  margin-top:15px;
  color:#9b3434;
  font-size:14px;
}

.back{
  display:block;
  margin-top:22px;
  color:#6b5a3d;
  text-decoration:none;
  font-size:14px;
}
</style>
</head>

<body>

<div class="login-box">

<div class="logo">KJCS</div>

<h1>11th room</h1>

<div class="line"></div>

<label for="password">
Password
</label>

<input
  id="password"
  type="password"
  autocomplete="off"
  placeholder="Enter password">

<button onclick="login()">
Enter
</button>

<div class="error" id="error"></div>

<div class="hint">
Hint: 中学入学時の人数
</div>

<a class="back" href="index.html">
← Back to Portal
</a>

</div>

<script>

async function sha256(text){

  const data =
    new TextEncoder().encode(text);

  const hash =
    await crypto.subtle.digest(
      "SHA-256",
      data
    );

  return [...new Uint8Array(hash)]
    .map(b => b.toString(16).padStart(2,"0"))
    .join("");
}


/*
  ここには「141」そのものではなく、
  SHA-256ハッシュを入れます。
*/

const ROOM_PASSWORD_HASH =
  "2c7d5490e6050836f8f2f0d496b1c8d6a38d4ffac2b898e6e77751bdcd20ebf5";

async function login(){

  const password =
    document.getElementById("password").value;

  const error =
    document.getElementById("error");

  error.textContent="";

  if(!password){
    error.textContent="Passwordを入力してください。";
    return;
  }

  const hash =
    await sha256(password);

  if(hash === ROOM_PASSWORD_HASH){

    sessionStorage.setItem(
      "kjcs_room_auth",
      "authenticated"
    );

    location.href="room.html";

  }else{

    error.textContent=
      "Passwordが正しくありません。";

  }
}

document
  .getElementById("password")
  .addEventListener("keydown",e=>{
    if(e.key==="Enter"){
      login();
    }
  });

</script>

</body>
</html>
