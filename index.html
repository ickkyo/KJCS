<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KJCS Portal</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  font-family:
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    sans-serif;
  color:#29261f;
  background:
    linear-gradient(rgba(30,34,27,.82),rgba(30,34,27,.82)),
    repeating-linear-gradient(
      90deg,
      #332c20 0px,
      #3e3526 3px,
      #2d261c 6px,
      #3b3224 12px
    );
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  opacity:.16;
  background-image:
    radial-gradient(#fff 1px,transparent 1px);
  background-size:4px 4px;
}

.container{
  width:min(920px,92%);
  margin:auto;
  padding:45px 0;
}

.header{
  text-align:center;
  color:#f5efe2;
  padding:45px 20px;
}

.logo-small{
  letter-spacing:6px;
  font-size:13px;
  color:#c8a96b;
}

.header h1{
  margin-top:12px;
  font-family:Georgia,"Times New Roman",serif;
  font-size:clamp(42px,9vw,76px);
  letter-spacing:5px;
}

.header p{
  margin-top:12px;
  color:#ddd5c4;
}

.gold-line{
  width:110px;
  height:1px;
  background:#c8a96b;
  margin:24px auto;
}

.card{
  position:relative;
  overflow:hidden;
  margin-top:22px;
  padding:28px;
  background:
    linear-gradient(rgba(250,246,235,.97),rgba(239,232,211,.97));
  border:1px solid #b99a5c;
  box-shadow:
    0 14px 35px rgba(0,0,0,.25),
    inset 0 0 0 5px rgba(255,255,255,.25);
}

.card::before{
  content:"";
  position:absolute;
  inset:7px;
  border:1px solid rgba(130,100,50,.25);
  pointer-events:none;
}

.card h2{
  position:relative;
  color:#463820;
  font-family:Georgia,"Times New Roman",serif;
  font-size:25px;
  margin-bottom:10px;
}

.card p{
  position:relative;
  line-height:1.8;
}

.button{
  position:relative;
  display:block;
  margin-top:20px;
  padding:15px;
  text-align:center;
  text-decoration:none;
  color:#f8f2e5;
  background:#26392c;
  border:1px solid #b99a5c;
  transition:.25s;
}

.button:hover{
  background:#3a5140;
  transform:translateY(-2px);
}

.hint{
  margin-top:14px;
  font-size:13px;
  color:#716b5d;
}

.footer{
  text-align:center;
  margin-top:35px;
  color:#bdb5a5;
  font-size:13px;
}

@media(max-width:600px){
  .container{
    padding:20px 0 35px;
  }

  .header{
    padding:30px 10px;
  }

  .card{
    padding:22px;
  }
}
</style>
</head>

<body>

<div class="container">

<header class="header">

<div class="logo-small">
KJCS
</div>

<h1>Portal</h1>

<div class="gold-line"></div>

<p>Student Portal</p>

</header>

<section class="card">

<h2>11th room</h2>

<p>
Class information, messages, schedule and feedback.
</p>

<a class="button" href="login.html">
Enter 11th room
</a>

<p class="hint">
Password hint: 中学入学時の人数
</p>

</section>

<section class="card">

<h2>Admin</h2>

<p>
Administration page.
</p>

<a class="button" href="admin.html">
Open Admin
</a>

</section>

<section class="card">

<h2>Information</h2>

<p id="today">
Loading...
</p>

</section>

<footer class="footer">
KJCS Portal<br>
Version 2.0
</footer>

</div>

<script>
const week=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const now=new Date();

document.getElementById("today").textContent =
now.getFullYear()+" / "+
String(now.getMonth()+1).padStart(2,"0")+" / "+
String(now.getDate()).padStart(2,"0")+
" ("+week[now.getDay()]+")";
</script>

</body>
</html>
