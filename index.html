<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>KJCS Portal</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Yu Gothic",sans-serif;
}

body{

background:
linear-gradient(rgba(255,248,235,.92),rgba(255,248,235,.92)),
url("https://images.unsplash.com/photo-1545239351-1141bd82e8a6?auto=format&fit=crop&w=1400&q=80");

background-size:cover;
background-attachment:fixed;

}

.container{

max-width:900px;
margin:40px auto;
padding:25px;

}

header{

background:#3e2c1f;
color:white;
padding:25px;
border-radius:18px;
text-align:center;
box-shadow:0 8px 18px rgba(0,0,0,.2);

}

header h1{

font-size:42px;

}

header p{

margin-top:8px;
opacity:.9;

}

.card{

margin-top:25px;
background:rgba(255,255,255,.95);
padding:25px;
border-radius:18px;
border:3px solid #9b7446;
box-shadow:0 5px 15px rgba(0,0,0,.1);

}

.card h2{

color:#5b3a19;
margin-bottom:15px;

}

.button{

display:block;
text-align:center;
margin-top:15px;

background:#6f8d4e;
color:white;

padding:16px;

border-radius:12px;

text-decoration:none;

font-size:20px;

transition:.3s;

}

.button:hover{

background:#4d6735;
transform:scale(1.02);

}

.info{

line-height:2;

}

.footer{

margin-top:35px;
text-align:center;
color:#555;

}

.version{

margin-top:10px;
font-size:14px;
color:#777;

}

</style>

</head>

<body>

<div class="container">

<header>

<h1>KJCS Portal</h1>

<p>
和モダン Student Portal
</p>

</header>

<div class="card">

<h2>🏫 11th room</h2>

<p>

クラス連絡・週間予定・配信情報はこちら

</p>

<a href="room.html" class="button">

Enter 11th room

</a>

<p style="margin-top:15px;color:#666;">

パスワード：141

<br>

ヒント：中学入学時の人数

</p>

</div>

<div class="card">

<h2>🛠 Admin</h2>

<p>

管理者専用ページ

</p>

<a href="admin.html" class="button">

Open Admin

</a>

</div>

<div class="card">

<h2>📢 What's New</h2>

<div class="info">

・Version2 開発中

<br>

・電光掲示板追加

<br>

・固定掲示板追加

<br>

・更新日時表示対応

<br>

・NEW表示対応

</div>

</div>

<div class="card">

<h2>📅 Information</h2>

<div id="today"></div>

</div>

<div class="footer">

KJCS Portal

<div class="version">

Version 2.0 Beta

</div>

</div>

</div>

<script>

const week=["日","月","火","水","木","金","土"];

const d=new Date();

document.getElementById("today").innerHTML=

d.getFullYear()+"年"

+(d.getMonth()+1)+"月"

+d.getDate()+"日"

+"（"+week[d.getDay()]+"）";

</script>

</body>

</html>
